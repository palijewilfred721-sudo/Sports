{% extends "base.html" %}
{% block title %}Teams{% endblock %}
{% block content %}
<h1>Teams</h1>
<section class="card">
  <h2>Add team</h2>
  <form method="post" class="inline">
    <input name="name" placeholder="Team name" required>
    <button>Add team</button>
  </form>
</section>
<section class="card">
  {% if teams %}
  <div class="table-wrap"><table>
    <thead><tr><th>Team</th><th>Players</th><th></th></tr></thead>
    <tbody>
    {% for t in teams %}
      <tr><td>{{ t.name }}</td>
          <td><a href="{{ url_for('players', team=t.id) }}">{{ t.player_count }}</a></td>
          <td class="right"><form method="post" action="{{ url_for('delete_team', team_id=t.id) }}"
              onsubmit="return confirm('Delete this team?')"><button class="danger">Delete</button></form></td></tr>
    {% endfor %}
    </tbody>
  </table></div>
  {% else %}<p class="muted">No teams yet.</p>{% endif %}
</section>
{% endblock %}
